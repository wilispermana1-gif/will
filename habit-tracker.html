<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HabitKu" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>HabitKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.07);
      --text: #e8e8f0;
      --muted: #555;
      --purple: #7c6aff;
      --green: #00ff88;
      --orange: #ff9d4d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Orbs */
    .orb1, .orb2 {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    }
    .orb1 { top: -100px; right: -100px; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(124,106,255,0.1) 0%, transparent 70%); }
    .orb2 { bottom: -80px; left: -80px; width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(0,255,136,0.07) 0%, transparent 70%); }

    .app {
      position: relative; z-index: 1;
      max-width: 480px; margin: 0 auto;
      padding: 48px 20px 100px;
    }

    /* HEADER */
    .header { margin-bottom: 28px; }
    .date-label {
      font-size: 11px; color: var(--muted); letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .title {
      font-family: 'Syne', sans-serif;
      font-size: 30px; font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #666 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* PROGRESS CARD */
    .progress-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px 24px;
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 18px;
    }
    .progress-info .big { font-size: 24px; font-weight: 700; }
    .progress-info .small { font-size: 12px; color: var(--muted); margin-left: 6px; }
    .progress-info .msg { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* WEEK */
    .week-bar {
      display: flex; gap: 6px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      border-radius: 16px; padding: 10px;
      margin-bottom: 20px;
    }
    .day-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      gap: 5px; padding: 8px 2px; border-radius: 12px; border: none;
      background: transparent; cursor: pointer;
      transition: background 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .day-btn.selected { background: rgba(124,106,255,0.2); outline: 1px solid rgba(124,106,255,0.45); }
    .day-name { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Mono', monospace; }
    .day-btn.today .day-name { color: var(--purple); }
    .day-num { font-size: 13px; font-weight: 600; color: #555; font-family: 'DM Mono', monospace; }
    .day-btn.selected .day-num { color: var(--text); }
    .day-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.08); transition: background 0.3s; }
    .day-dot.done { background: var(--green); }
    .day-dot.partial { background: var(--purple); }

    /* HABITS */
    .habit-list { margin-bottom: 14px; }
    .habit-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 15px;
      margin-bottom: 10px; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .habit-item.checked { background: rgba(0,255,136,0.05); }
    .habit-item.not-today { opacity: 0.45; cursor: default; }
    .habit-item:active { transform: scale(0.97); }

    .check-circle {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      font-size: 14px; font-weight: 700; color: #0a0a0f;
    }
    .habit-icon { font-size: 22px; flex-shrink: 0; }
    .habit-info { flex: 1; min-width: 0; }
    .habit-name { font-size: 14px; font-weight: 500; transition: all 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .habit-item.checked .habit-name { text-decoration: line-through; color: #555; }
    .habit-streak { font-size: 11px; color: var(--orange); margin-top: 3px; }
    .delete-btn {
      background: none; border: none; color: #333; font-size: 20px;
      cursor: pointer; padding: 4px 6px; line-height: 1; flex-shrink: 0;
      transition: color 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .delete-btn:hover, .delete-btn:active { color: #ff6b6b; }

    /* ADD HABIT */
    .add-btn {
      width: 100%; padding: 14px;
      background: transparent; border: 1px dashed rgba(255,255,255,0.12);
      border-radius: 16px; color: var(--muted); font-size: 13px;
      cursor: pointer; letter-spacing: 1px; font-family: 'DM Mono', monospace;
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .add-btn:hover, .add-btn:active { border-color: rgba(124,106,255,0.45); color: var(--purple); }

    .add-form {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(124,106,255,0.3);
      border-radius: 16px; padding: 20px;
    }
    .form-label { font-size: 11px; color: var(--purple); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
    .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .emoji-btn {
      font-size: 20px; padding: 7px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .emoji-btn.active { background: rgba(124,106,255,0.3); }
    .habit-input {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      color: var(--text); font-size: 14px; padding: 11px 14px;
      margin-bottom: 12px; outline: none; font-family: 'DM Mono', monospace;
    }
    .habit-input:focus { border-color: rgba(124,106,255,0.5); }
    .form-btns { display: flex; gap: 8px; }
    .btn-save {
      flex: 1; padding: 11px; background: rgba(124,106,255,0.85);
      border: none; border-radius: 10px; color: #fff;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Mono', monospace;
    }
    .btn-cancel {
      flex: 1; padding: 11px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #666;
      font-size: 13px; cursor: pointer; font-family: 'DM Mono', monospace;
    }

    /* INSTALL BANNER */
    .install-banner {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,30,0.95); border: 1px solid rgba(124,106,255,0.4);
      border-radius: 16px; padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      max-width: 440px; width: calc(100% - 40px);
      backdrop-filter: blur(10px); z-index: 100;
      animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .install-text { flex: 1; font-size: 12px; color: #aaa; line-height: 1.5; }
    .install-text strong { color: var(--text); display: block; margin-bottom: 2px; }
    .install-close {
      background: none; border: none; color: #444; font-size: 18px;
      cursor: pointer; padding: 4px; flex-shrink: 0;
    }
    .install-icon { font-size: 24px; flex-shrink: 0; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
<div class="orb1"></div>
<div class="orb2"></div>
<div class="app">
  <div class="header">
    <div class="date-label" id="dateLabel"></div>
    <div class="title">HabitKu</div>
    <div class="subtitle">Tetap konsisten, satu hari satu langkah.</div>
  </div>

  <div class="progress-card">
    <svg id="ring" width="76" height="76" viewBox="0 0 76 76">
      <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
      <circle id="ringArc" cx="38" cy="38" r="30" fill="none"
        stroke="#7c6aff" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="188.5" stroke-dashoffset="188.5"
        transform="rotate(-90 38 38)"
        style="transition: stroke-dashoffset 0.6s cubic-bezier(0.34,1.56,0.64,1), stroke 0.4s"/>
      <text id="ringPct" x="38" y="43" text-anchor="middle" fill="#e8e8f0"
        font-size="14" font-weight="700" font-family="DM Mono, monospace">0%</text>
    </svg>
    <div class="progress-info">
      <div><span class="big" id="progressCount">0/0</span><span class="small">selesai</span></div>
      <div class="msg" id="progressMsg">Ayo mulai hari ini!</div>
    </div>
  </div>

  <div class="week-bar" id="weekBar"></div>
  <div class="habit-list" id="habitList"></div>

  <div id="addArea">
    <button class="add-btn" id="addBtn" onclick="showForm()">+ Tambah Habit</button>
  </div>

  <div class="add-form" id="addForm" style="display:none;">
    <div class="form-label">Habit Baru</div>
    <div class="emoji-grid" id="emojiGrid"></div>
    <input class="habit-input" id="habitInput" placeholder="Nama habit..." maxlength="30"
      oninput="void 0" onkeydown="if(event.key==='Enter')saveHabit()" />
    <div class="form-btns">
      <button class="btn-save" onclick="saveHabit()">Simpan</button>
      <button class="btn-cancel" onclick="hideForm()">Batal</button>
    </div>
  </div>
</div>

<!-- Install Banner -->
<div class="install-banner" id="installBanner" style="display:none;">
  <div class="install-icon">📲</div>
  <div class="install-text">
    <strong>Pasang di Home Screen</strong>
    Tap <b>Share → Add to Home Screen</b> (iOS) atau menu browser (Android) untuk akses cepat.
  </div>
  <button class="install-close" onclick="document.getElementById('installBanner').style.display='none'">×</button>
</div>

<script>
const EMOJIS = ["⭐","🔥","💪","🎯","✍️","🎵","🌿","🍎","😴","🧠","💻","🎨","🚴","🏋️","🧘"];
const COLORS = ["#00ff88","#7c6aff","#00cfff","#ff9d4d","#ff6b9d","#ffd93d","#6bcb77","#4d96ff","#a29bfe","#ff6348"];
const DAYS = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const MONTHS = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"];

let habits = JSON.parse(localStorage.getItem("hk_habits") || "null") || [
  {id:1, name:"Olahraga", icon:"🏃", color:"#00ff88"},
  {id:2, name:"Baca Buku", icon:"📚", color:"#7c6aff"},
  {id:3, name:"Minum Air", icon:"💧", color:"#00cfff"},
  {id:4, name:"Meditasi", icon:"🧘", color:"#ff9d4d"},
];
let checkIns = JSON.parse(localStorage.getItem("hk_checkins") || "{}");
let selectedDay = todayKey();
let selectedEmoji = "⭐";

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getLast7() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push({
      key: `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,
      label: DAYS[d.getDay()], date: d.getDate(), isToday: i === 0,
    });
  }
  return days;
}

function getStreak(habitId) {
  let s = 0; const d = new Date();
  while (true) {
    const k = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    if ((checkIns[k] || []).includes(habitId)) { s++; d.setDate(d.getDate()-1); }
    else break;
  }
  return s;
}

function save() {
  localStorage.setItem("hk_habits", JSON.stringify(habits));
  localStorage.setItem("hk_checkins", JSON.stringify(checkIns));
}

function toggle(habitId) {
  if (selectedDay !== todayKey()) return;
  const arr = checkIns[selectedDay] || [];
  checkIns[selectedDay] = arr.includes(habitId)
    ? arr.filter(x => x !== habitId) : [...arr, habitId];
  save(); render();
}

function removeHabit(id) {
  habits = habits.filter(h => h.id !== id);
  Object.keys(checkIns).forEach(k => { checkIns[k] = (checkIns[k]||[]).filter(x => x !== id); });
  save(); render();
}

function showForm() {
  document.getElementById("addBtn").style.display = "none";
  document.getElementById("addForm").style.display = "block";
  renderEmojis();
  setTimeout(() => document.getElementById("habitInput").focus(), 100);
}

function hideForm() {
  document.getElementById("addBtn").style.display = "block";
  document.getElementById("addForm").style.display = "none";
  document.getElementById("habitInput").value = "";
  selectedEmoji = "⭐";
}

function saveHabit() {
  const name = document.getElementById("habitInput").value.trim();
  if (!name) return;
  habits.push({ id: Date.now(), name, icon: selectedEmoji, color: COLORS[habits.length % COLORS.length] });
  save(); hideForm(); render();
}

function renderEmojis() {
  const grid = document.getElementById("emojiGrid");
  grid.innerHTML = EMOJIS.map(e =>
    `<button class="emoji-btn${e===selectedEmoji?' active':''}" onclick="selectEmoji('${e}')">${e}</button>`
  ).join("");
}

function selectEmoji(e) {
  selectedEmoji = e; renderEmojis();
}

function render() {
  // Date
  const now = new Date();
  document.getElementById("dateLabel").textContent =
    `${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

  // Progress
  const today = todayKey();
  const checked = (checkIns[today] || []).length;
  const total = habits.length;
  const pct = total ? Math.round(checked / total * 100) : 0;

  const arc = 2 * Math.PI * 30;
  document.getElementById("ringArc").setAttribute("stroke-dashoffset", arc * (1 - pct/100));
  document.getElementById("ringArc").setAttribute("stroke", pct === 100 ? "#00ff88" : "#7c6aff");
  document.getElementById("ringPct").textContent = pct + "%";
  document.getElementById("progressCount").textContent = `${checked}/${total}`;
  document.getElementById("progressMsg").textContent =
    pct === 100 ? "🎉 Sempurna hari ini!" : pct >= 50 ? "Terus semangat!" : "Ayo mulai hari ini!";

  // Week
  const days = getLast7();
  document.getElementById("weekBar").innerHTML = days.map(d => {
    const dc = (checkIns[d.key] || []).length;
    const isSelected = selectedDay === d.key;
    const dotClass = dc >= total && total > 0 ? "done" : dc > 0 ? "partial" : "";
    return `<button class="day-btn${isSelected?' selected':''}${d.isToday?' today':''}"
      onclick="selectDay('${d.key}')">
      <span class="day-name">${d.label}</span>
      <span class="day-num">${d.date}</span>
      <div class="day-dot ${dotClass}"></div>
    </button>`;
  }).join("");

  // Habits
  const isToday = selectedDay === todayKey();
  document.getElementById("habitList").innerHTML = habits.map(h => {
    const chk = (checkIns[selectedDay] || []).includes(h.id);
    const streak = getStreak(h.id);
    const checkStyle = chk
      ? `border-color:${h.color};background:${h.color};box-shadow:0 0 12px ${h.color}55`
      : `border-color:rgba(255,255,255,0.15)`;
    const cardStyle = chk
      ? `background:rgba(0,0,0,0.1);border-color:${h.color}44`
      : ``;
    return `<div class="habit-item${chk?' checked':''}${!isToday?' not-today':''}"
      style="${cardStyle}" onclick="toggle(${h.id})">
      <div class="check-circle" style="${checkStyle}">${chk?'✓':''}</div>
      <div class="habit-icon">${h.icon}</div>
      <div class="habit-info">
        <div class="habit-name">${h.name}</div>
        ${streak > 0 ? `<div class="habit-streak">🔥 ${streak} hari berturut-turut</div>` : ''}
      </div>
      <button class="delete-btn" onclick="event.stopPropagation();removeHabit(${h.id})">×</button>
    </div>`;
  }).join("");
}

function selectDay(key) { selectedDay = key; render(); }

// Show install banner after 3 seconds if not standalone
window.addEventListener("load", () => {
  render();
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true;
  if (!isStandalone && !localStorage.getItem("hk_banner_dismissed")) {
    setTimeout(() => {
      document.getElementById("installBanner").style.display = "flex";
    }, 3000);
  }
  document.getElementById("installBanner").querySelector(".install-close").addEventListener("click", () => {
    localStorage.setItem("hk_banner_dismissed", "1");
  });
});
</script>
</body>
</html>
